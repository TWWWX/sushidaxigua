        <script type="text/javascript">
            var preloader;
            var adCompleteFlag = false;
            var resCompleteFlag = false;

            var adEndComplete = false;
            var resEndComplete = false;

            judgeLanTitle();

            function judgeLanTitle() {

                //        console.log("window.navigator.language",window.navigator.language);

                if (window.navigator.language == "zh-CN" || window.navigator.language == "zh-cn") {
                    document.title = "小游戏：合成大苏轼";
                } else if (window.navigator.language == "zh-TW") {
                    document.title = "小遊戲：合成大苏轼";
                } else if (window.navigator.language == "zh-HK") {
                    document.title = "小遊戲：合成大苏轼";
                } else if (window.navigator.language == "ko-KR") {
                    document.title = "작은 놀이：큰 수박 을 합성 하 다";
                } else if (window.navigator.language == "ja-JP") {
                    document.title = "ミニゲーム：合成スイカ";
                } else if (window.navigator.language == "th-TH") {
                    document.title = "เกมเล็กๆ：แตงโมสังเคราะห์";
                } else {
                    document.title = "Little game：Synthetic watermelon";
                }


            }

            window.timer = null;
            window.tempSeconds = 1;
            window.loadData = {};
            loadData.completedCount = 0;
            loadData.totalCount = 0;

            function startLoadingFlow() {
                var loadintT = document.getElementById("loadingText");
                var loadintGif = document.getElementById("loadingImg");
                setTimeout(function() {
                    loadintT.style.display = "";
                    updateLabView(0.1);
                }, 1 * 1000);
            }

            function onload() {
                var winHeight = document.documentElement.clientHeight;
                document.getElementById("canvasDiv").style.height = winHeight + "px";
            };
            window.onload = function() {
                document.getElementById("block-Box").style.display = "none";
            }

            function updateLabView(t) {
                if (timer != null) {
                    clearInterval(timer);
                }
                timer = setInterval(function() {
                    tempSeconds++;
                    actualTotal();
                    var loadintT = document.getElementById("loadingText")
                    if (!loadintT) {
                        return;
                    }
                    loadintT.innerHTML = '苏轼加载中……' + parseInt(tempSeconds) + '%';

                    switch (tempSeconds) {
                        case 20:
                            updateLabView(0.2);
                            break;
                        case 40:
                            updateLabView(0.3);
                            break;
                        case 60:
                            updateLabView(0.4);
                            break;
                        case 96:
                            updateLabView(5);
                            break;
                        case 97:
                            updateLabView(10);
                            break;
                        case 98:
                            updateLabView(50);
                            break;
                        case 99:
                            updateLabView(100);
                            break;
                        default:
                            if (tempSeconds >= 80 && tempSeconds < 96) {
                                updateLabView(t + 0.1);
                            }
                            break;
                    }
                    if (tempSeconds > 100) {
                        clearInterval(timer);
                        tempSeconds = 100
                        loadintT.innerHTML = '苏轼加载中……' + parseInt(tempSeconds) + '%';
                        var loadintGif = document.getElementById("loadingImg");
                        if (loadintGif) { loadintGif.remove(); }
                        loadintT.remove();
                    }
                }, t * 1000);
            }

            function actualTotal() {
                var percent = parseInt(100 * loadData.completedCount / loadData.totalCount);
                if (percent > tempSeconds && loadData.totalCount > 1) {
                    tempSeconds = percent;
                }
            }


            /*setTimeout("ShowBannerAD()","2000");*/
        </script>

    <!-- 首页入口逻辑：启动游戏加载与引擎 -->
    <script type="text/javascript">
        window._suStartGame = function (version) {
            window._suGameVersion = version || 'ancient';
            var home = document.getElementById('homePage');
            var game = document.getElementById('gamePage');
            if (home) { home.style.display = 'none'; }
            if (game) { game.style.display = 'block'; }
            onload();
            startLoadingFlow();

            // 启动 cocos 引擎
            if (typeof VConsole !== 'undefined') {
                window.vConsole = new VConsole();
            }

            var splash = document.getElementById('splash');
            splash.style.display = 'block';

            console.log("indexlTextTTTT");

            var cocos2d = document.createElement('script');
            cocos2d.async = true;
            cocos2d.src = window._CCSettings.debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js';

            var engineLoaded = function() {
                document.body.removeChild(cocos2d);
                cocos2d.removeEventListener('load', engineLoaded, false);
                window.boot();
            };
            cocos2d.addEventListener('load', engineLoaded, false);
            document.body.appendChild(cocos2d);
        };

        (function initHome() {
            var HASH_VERSION_MAP = {
                'old': 'ancient',
                'new': 'modern',
                'mix': 'mix'
            };

            function routeByHash() {
                var hash = window.location.hash.replace(/^#\/?/, '');
                if (!hash) {
                    var home = document.getElementById('homePage');
                    var game = document.getElementById('gamePage');
                    if (home) { home.style.display = 'block'; }
                    if (game) { game.style.display = 'none'; }
                    return;
                }
                var version = HASH_VERSION_MAP[hash];
                if (version) {
                    window._suStartGame(version);
                }
            }

            document.querySelectorAll('.entry-card').forEach(function (el) {
                el.addEventListener('click', function () {
                    var version = el.getAttribute('data-version') || 'ancient';
                    var hashKey = null;
                    for (var k in HASH_VERSION_MAP) {
                        if (HASH_VERSION_MAP[k] === version) { hashKey = k; break; }
                    }
                    if (hashKey) {
                        var newHash = '#/' + hashKey;
                        if (window.location.hash === newHash) {
                            routeByHash();
                        } else {
                            window.location.hash = newHash;
                        }
                    } else {
                        window._suStartGame(version);
                    }
                });
            });

            window.addEventListener('hashchange', routeByHash);
            routeByHash();
        })();

        // 测试快捷键：进入游戏后按 F2 直接弹出合成结束结果页
        window.addEventListener('keydown', function (e) {
            if (e.key !== 'F2') { return; }
            if (typeof cc === 'undefined' || !cc.find) {
                console.warn('[测试] cocos 引擎尚未就绪，请先进入游戏（如 #/old）等待加载完成');
                return;
            }
            try {
                var gmNode = cc.find('Canvas/gameManager');
                if (!gmNode) {
                    console.warn('[测试] 未找到 Canvas/gameManager 节点，请确保已进入游戏');
                    return;
                }
                var gm = gmNode.getComponent('GameManager');
                if (!gm || typeof gm.GameOver !== 'function') {
                    console.warn('[测试] GameManager.GameOver 不可用');
                    return;
                }
                gm.GameOver();
                console.log('[测试] 已触发 GameOver，结果页已显示');
            } catch (err) {
                console.error('[测试] 触发失败:', err);
            }
        });
    </script>
